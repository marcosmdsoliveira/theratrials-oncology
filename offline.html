<style>
  body {
    background: #0E0F12 !important;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem 1.25rem;
    font-family: 'Outfit', system-ui, sans-serif;
    color: #F5F6F7;
  }
  body::before { display: none !important; }
  .offline-wrap { max-width: 460px; text-align: center; }
  .offline-orbit {
    width: 110px; height: 110px; margin: 0 auto 1.75rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFA640 0%, #FF8400 60%, #B85D00 100%);
    display: flex; align-items: center; justify-content: center;
    color: #0E0F12; font-weight: 700; font-size: 1.15rem;
    box-shadow: 0 0 50px rgba(255,132,0,0.25);
    position: relative;
  }
  .offline-orbit::after {
    content: ''; position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed rgba(255,132,0,0.3);
    animation: orbit 14s linear infinite;
  }
  @keyframes orbit { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600; letter-spacing: -0.015em;
    margin: 0 0 0.75rem;
  }
  h1 .accent { color: #FF8400; }
  p { color: #8E949C; line-height: 1.6; margin: 0 0 1.5rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.75rem 1.4rem;
    background: #FF8400; color: #0E0F12;
    font-weight: 600; font-size: 0.95rem;
    border-radius: 10px; border: none;
    text-decoration: none; cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover, .btn:focus { background: #FFA640; transform: translateY(-1px); color: #0E0F12; }
  .btn-ghost {
    background: transparent; color: #8E949C;
    border: 1px solid rgba(143,148,156,0.25);
    margin-left: 0.5rem;
  }
  .btn-ghost:hover { color: #F5F6F7; border-color: #8E949C; }
  .small {
    margin-top: 1.75rem;
    font-size: 0.78rem; color: #5C616A;
  }
  .quick-links {
    margin-top: 2rem;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
  }
  .quick-links a {
    background: #14161B;
    border: 1px solid rgba(143,148,156,0.18);
    padding: 0.5rem 0.85rem;
    border-radius: 8px;
    font-size: 0.82rem;
    color: #F5F6F7;
    text-decoration: none;
    transition: all 0.15s;
  }
  .quick-links a:hover { border-color: #FF8400; color: #FFA640; }
</style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3c576b68-e2b3-4982-82e7-688e5a8adf58"></script>
</head>
<body>
<main class="offline-wrap">
  <div class="offline-orbit">offline</div>
  <h1>Sem conexão · <span class="accent">aguardando órbita</span></h1>
  <p>Você está offline no momento. Algumas páginas que já visitou ficam disponíveis em cache. Reconecte-se à internet para acessar atualizações e novos conteúdos.</p>
  <button class="btn" onclick="location.reload()">
    Tentar novamente
  </button>
  <a href="index.html" class="btn btn-ghost">Ir para início</a>

  <div class="quick-links" id="quick-links">
    <!-- preenchidos via JS se houver páginas em cache -->
  </div>

  <p class="small">© TheraTrials Oncology · uso educacional</p>
</main>

<script>
  // Lista páginas em cache para sugestão de navegação offline
  if ('caches' in window) {
    caches.keys().then(async (keys) => {
      const pageCacheKey = keys.find(k => k.includes('-pages'));
      if (!pageCacheKey) return;
      const cache = await caches.open(pageCacheKey);
      const reqs = await cache.keys();
      const links = reqs
        .map(r => new URL(r.url))
        .filter(u => u.pathname.endsWith('.html') && !u.pathname.endsWith('offline.html'))
        .slice(0, 8);
      const wrap = document.getElementById('quick-links');
      const NAMES = {
        'index.html': 'Início',
        'database.html': 'Database',
        'ensaios-clinicos.html': 'Ensaios clínicos ativos (BR)',
        'tumor-boards.html': 'Tumor boards',
        'modalidades.html': 'Modalidades',
        'ferramentas.html': 'Ferramentas',
        'fundamentos.html': 'Fundamentos',
        'guidelines.html': 'Guidelines',
        'guideline-detail.html': 'Guideline Detail',
        'about.html': 'Sobre',
        'lu-psma.html': '177Lu-PSMA',
        'lu-dotatate.html': '177Lu-DOTATATE',
        'ra-223.html': '223Ra',
        'y90.html': '90Y',
        'mibg.html': '131I-MIBG',
        'novos-alfa.html': 'Novos α'
      };
      const seen = new Set();
      links.forEach(u => {
        const name = u.pathname.split('/').pop();
        if (seen.has(name)) return;
        seen.add(name);
        const label = NAMES[name] || name.replace('.html','');
        const a = document.createElement('a');
        a.href = u.pathname;
        a.textContent = label;
        wrap.appendChild(a);
      });
    });
  }

  // Volta automaticamente quando a internet retornar
  window.addEventListener('online', () => location.reload());
</script>
<script src="assets/js/pwa-install.js" defer></script>

</body>
