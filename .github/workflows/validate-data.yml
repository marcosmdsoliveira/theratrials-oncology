name: Validate database & trial links

# Roda a cada push que altere os datasets e valida que TODOS os links
# apontam para o registro correto:
#  - data.js: pubmed_url (PMID real via NCT[si]) + nct_url (NCT do ensaio)
#  - trials_br.js: NCT dos cards do Trial Matcher (existe, URLs consistentes,
#    recrutando, Brasil entre os locais)
# Falha o check se houver PMID/NCT fabricado ou link inconsistente.
#
# Também pode ser disparado manualmente (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/data.js'
      - 'assets/js/trials_br.js'
      - 'scripts/validate_cards.mjs'
      - 'scripts/validate_cards.test.mjs'
      - 'scripts/validate_pubmed.mjs'
      - 'scripts/validate_nct.mjs'
      - 'scripts/validate_trials_br.mjs'
      - 'index.html'
      - 'assets/lang/pt-br.js'
      - 'assets/lang/en.js'
      - 'scripts/sync_counts.mjs'
      - 'scripts/db_v2/**'
      - '.claude/agents/database-*.md'
      - 'scripts/db_decisoes.json'
      - 'scripts/db_candidatos_integridade.json'
      - 'scripts/db_integridade.py'
      - 'scripts/test_db_integridade.py'
      - 'assets/js/citation.js'
      - 'scripts/citation.test.mjs'
      - 'assets/js/secondary-cards.js'
      - 'scripts/secondary_cards.test.mjs'
      - 'scripts/asset_versions.mjs'
      - 'scripts/asset_versions.test.mjs'
      - '.github/workflows/validate-data.yml'
  # A lista do pull_request tem de incluir os PRÓPRIOS validadores, não só os
  # dados. Sem isso, um PR que mexe só no validador não roda o validador — foi
  # o que aconteceu com o PR #11, que o criou: zero checks.
  pull_request:
    paths:
      - 'assets/js/data.js'
      - 'assets/js/trials_br.js'
      - 'index.html'
      - 'assets/lang/pt-br.js'
      - 'assets/lang/en.js'
      - 'scripts/validate_cards.mjs'
      - 'scripts/validate_cards.test.mjs'
      - 'scripts/validate_pubmed.mjs'
      - 'scripts/validate_nct.mjs'
      - 'scripts/validate_trials_br.mjs'
      - 'scripts/sync_counts.mjs'
      - 'scripts/db_v2/**'
      - '.claude/agents/database-*.md'
      - 'scripts/db_decisoes.json'
      - 'scripts/db_candidatos_integridade.json'
      - 'scripts/db_integridade.py'
      - 'scripts/test_db_integridade.py'
      - 'assets/js/citation.js'
      - 'scripts/citation.test.mjs'
      - 'assets/js/secondary-cards.js'
      - 'scripts/secondary_cards.test.mjs'
      - 'scripts/asset_versions.mjs'
      - 'scripts/asset_versions.test.mjs'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 2 commits: o Database v2 confere que nenhum uid do commit anterior sumiu
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Baratos e offline: rodam antes dos validadores de link, que gastam
      # minutos batendo em NCBI e CT.gov.
      - name: Conferir as contagens escritas no texto do site
        run: node scripts/sync_counts.mjs --check

      # Confere o que o card DIZ, não os links: condensação fiel em
      # `resultado_chave`, contagens internas do data.js, schema núcleo
      # congelado. Menos de um segundo, sem rede.
      - name: Validate card content (THERA_DATA)
        if: always()
        run: node scripts/validate_cards.mjs --json cards-report.json

      - name: Testar o próprio guard de cards
        if: always()
        run: node --test scripts/validate_cards.test.mjs scripts/citation.test.mjs scripts/secondary_cards.test.mjs scripts/study_families.test.mjs scripts/asset_versions.test.mjs

      # Database v2 em modo SOMBRA: testes, lift do data.js num diretório temporário,
      # validate_v2 e export_legacy --check (a sombra tem de reproduzir o data.js byte a
      # byte). Offline, sem secrets, nunca escreve no data.js. Falha só em erro estrutural;
      # lacunas de completude vão para o resumo e para o artifact.
      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Database v2 (sombra)
        if: always()
        run: python3 scripts/db_v2/ci_v2.py --report v2-report.json --base-ref HEAD^

      # Agentes database-curator/verifier (assistente de revisão humana): schemas, prioridade, consenso do
      # verifier duplo, execução restrita a Read/Grep/Glob e ausência de caminho de apply. Offline.
      - name: Agentes do Database (curator/verifier)
        if: always()
        working-directory: scripts/db_v2/agents
        run: python3 -m unittest discover -s tests -v

      # Backlog canônico de integridade (db_candidatos_integridade.json), separado do v2:
      # invariantes do arquivo, os testes do backlog e a transição contra o commit anterior
      # (nada apagado, nada final rebaixado, history só cresce). Offline, só lê.
      - name: Validar backlog de integridade
        if: always()
        working-directory: scripts
        run: |
          python3 db_integridade.py --validar
          python3 -m unittest -v test_db_integridade
          if git cat-file -e HEAD^:scripts/db_candidatos_integridade.json 2>/dev/null; then
            git show HEAD^:scripts/db_candidatos_integridade.json > "$RUNNER_TEMP/backlog_anterior.json"
            python3 -c 'import json, os, sys, db_integridade as I
          antes = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "backlog_anterior.json")))
          erros = I.invariantes_de_transicao(antes, I.carregar())
          [print("ERRO", e) for e in erros]
          sys.exit(1 if erros else 0)'
          fi

      - name: Validate pubmed_url integrity
        if: always()
        run: node scripts/validate_pubmed.mjs --json pubmed-report.json

      - name: Validate ClinicalTrials.gov (NCT) integrity
        if: always()
        run: node scripts/validate_nct.mjs --json nct-report.json

      - name: Validate Trial Matcher (trials_br) links
        if: always()
        run: node scripts/validate_trials_br.mjs --json trials-br-report.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-reports
          path: |
            cards-report.json
            pubmed-report.json
            nct-report.json
            trials-br-report.json
            v2-report.json
          if-no-files-found: ignore
