name: Validate database & trial links

# Roda a cada push que altere os datasets e valida que TODOS os links
# apontam para o registro correto:
#  - data.js: pubmed_url (PMID real via NCT[si]) + nct_url (NCT do ensaio)
#  - trials_br.js: NCT dos cards do Trial Matcher (existe, URLs consistentes,
#    recrutando, Brasil entre os locais)
# Falha o check se houver PMID/NCT fabricado ou link inconsistente.
#
# Também pode ser disparado manualmente (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/data.js'
      - 'assets/js/trials_br.js'
      - 'scripts/validate_cards.mjs'
      - 'scripts/validate_cards.test.mjs'
      - 'scripts/validate_pubmed.mjs'
      - 'scripts/validate_nct.mjs'
      - 'scripts/validate_trials_br.mjs'
      - 'index.html'
      - 'assets/lang/pt-br.js'
      - 'assets/lang/en.js'
      - 'scripts/sync_counts.mjs'
  # A lista do pull_request tem de incluir os PRÓPRIOS validadores, não só os
  # dados. Sem isso, um PR que mexe só no validador não roda o validador — foi
  # o que aconteceu com o PR #11, que o criou: zero checks.
  pull_request:
    paths:
      - 'assets/js/data.js'
      - 'assets/js/trials_br.js'
      - 'index.html'
      - 'assets/lang/pt-br.js'
      - 'assets/lang/en.js'
      - 'scripts/validate_cards.mjs'
      - 'scripts/validate_cards.test.mjs'
      - 'scripts/validate_pubmed.mjs'
      - 'scripts/validate_nct.mjs'
      - 'scripts/validate_trials_br.mjs'
      - 'scripts/sync_counts.mjs'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Baratos e offline: rodam antes dos validadores de link, que gastam
      # minutos batendo em NCBI e CT.gov.
      - name: Conferir as contagens escritas no texto do site
        run: node scripts/sync_counts.mjs --check

      # Confere o que o card DIZ, não os links: condensação fiel em
      # `resultado_chave`, contagens internas do data.js, schema núcleo
      # congelado. Menos de um segundo, sem rede.
      - name: Validate card content (THERA_DATA)
        if: always()
        run: node scripts/validate_cards.mjs --json cards-report.json

      - name: Testar o próprio guard de cards
        if: always()
        run: node --test scripts/validate_cards.test.mjs

      - name: Validate pubmed_url integrity
        if: always()
        run: node scripts/validate_pubmed.mjs --json pubmed-report.json

      - name: Validate ClinicalTrials.gov (NCT) integrity
        if: always()
        run: node scripts/validate_nct.mjs --json nct-report.json

      - name: Validate Trial Matcher (trials_br) links
        if: always()
        run: node scripts/validate_trials_br.mjs --json trials-br-report.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-reports
          path: |
            cards-report.json
            pubmed-report.json
            nct-report.json
            trials-br-report.json
          if-no-files-found: ignore
