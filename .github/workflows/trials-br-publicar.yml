name: Trial Matcher — colher curadoria e abrir PR

# Etapa 2 de 2. Lê o batch enfileirado ontem, monta os cards e abre um Pull
# Request. NUNCA commita em main: todo card é rascunho até revisão clínica.

on:
  schedule:
    - cron: '30 11 4 * *'   # dia 4, 11:30 UTC (≈ 08:30 BRT) — ~30h após o enfileiramento
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch a colher (vazio = usa o registrado pela etapa 1)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: trials-br
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar SDK
        run: pip install --quiet anthropic

      - name: Resolver o batch
        id: b
        run: |
          ID="${{ github.event.inputs.batch_id }}"
          [ -z "$ID" ] && ID=$(cat scripts/batch_pendente.txt 2>/dev/null || true)
          if [ -z "$ID" ]; then
            echo "::notice title=Nada a fazer::Nenhum batch pendente."
            echo "vazio=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # A etapa 1 não deixou o discovery.json (grande demais para commitar).
      # Refazer é determinístico, leva segundos e não custa nada — o --colher
      # precisa dele para os campos factuais (centros, fase, patrocinador).
      - name: Refazer a descoberta
        if: steps.b.outputs.vazio != 'true'
        run: python3 scripts/br_discover.py

      - name: Conferir se terminou
        if: steps.b.outputs.vazio != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/br_curate.py --status "${{ steps.b.outputs.id }}" | tee _st.txt
          grep -q 'ended' _st.txt || { echo "::error title=Batch ainda processando::Rode de novo mais tarde com workflow_dispatch."; exit 1; }

      - name: Colher
        if: steps.b.outputs.vazio != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/br_curate.py --colher "${{ steps.b.outputs.id }}" | tee _colheita.txt

      # O merge valida com node e aborta sozinho se o JS não parsear
      # ou se a contagem de estudos não bater.
      - name: Mesclar em trials_br.js
        if: steps.b.outputs.vazio != 'true'
        run: python3 scripts/br_merge.py | tee _merge.txt

      # Estudos abrem centros novos ao longo do recrutamento, e o card não
      # acompanha sozinho. Sem este passo, a lista de locais envelhece: em
      # 2026-08 faltavam 560 centros nos cards já publicados.
      - name: Atualizar centros contra o CT.gov
        if: steps.b.outputs.vazio != 'true'
        run: python3 scripts/br_centros.py --aplicar | tee _centros.txt

      # Depois do merge e antes de validar: a home anuncia o número de ensaios
      # abertos no Brasil em 8 lugares, PT e EN. Sem isso o PR publica cards
      # novos e deixa o texto do site mentindo.
      - name: Sincronizar as contagens do texto do site
        if: steps.b.outputs.id != ''
        run: node scripts/sync_counts.mjs

      - name: Validar links dos cards novos
        if: steps.b.outputs.vazio != 'true'
        run: node scripts/validate_trials_br.mjs

      - name: Regenerar app-data
        if: steps.b.outputs.vazio != 'true'
        run: |
          node scripts/export_app_data.mjs
          node scripts/validate_app_data.mjs

      - name: Abrir Pull Request
        if: steps.b.outputs.vazio != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(date -u +%Y-%m-%d)
          BR="trials-br/$DATA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          rm -f scripts/batch_pendente.txt
          git add assets/js/trials_br.js app-data/ scripts/batch_pendente.txt
          git commit -m "trials-br: curadoria $DATA (rascunho, revisar antes de publicar)" || {
            echo "::notice title=Sem mudanças::Nada para publicar."; exit 0; }
          git push -u origin "$BR"

          {
            echo "## Curadoria do Trial Matcher — $DATA"
            echo
            echo "> **Rascunho.** Cada card foi redigido a partir do registro oficial do"
            echo "> ClinicalTrials.gov e **precisa de revisão clínica antes do merge.**"
            echo "> Cards marcados \`⚠ RASCUNHO\` trazem a confiança e o que o revisor deve conferir."
            echo
            echo '### Colheita'; echo '```'; cat _colheita.txt; echo '```'
            echo '### Merge';    echo '```'; cat _merge.txt;    echo '```'
            echo '### Centros (CT.gov)'; echo '```'; tail -20 _centros.txt; echo '```'
            echo
            echo "### Como revisar"
            echo "1. Abra o diff de \`assets/js/trials_br.js\`."
            echo "2. Comece pelos de **confiança baixa** — estão listados acima."
            echo "3. Confira cada card contra o registro (link em \`fonte_url\`):"
            echo "   população, linha terapêutica, biomarcador exigido e critérios."
            echo "4. Corrija o que precisar e **remova a linha \`// ⚠ RASCUNHO\`** de cada card aprovado."
            echo "5. Se um card não servir, apague o objeto inteiro."
          } > _pr.md

          gh pr create --title "Trial Matcher: curadoria $DATA (rascunho)" \
                       --body-file _pr.md --base main --head "$BR" \
                       --label "trials-br,revisao-clinica"

      - name: Abrir issue se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const t = `Pipeline do Trial Matcher falhou na publicação (${new Date().toISOString().slice(0,10)})`;
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'trials-br-falha',
            });
            if (abertas.data.some(i => i.title === t)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: t, labels: ['trials-br-falha'],
              body: [
                'A etapa de colheita/PR falhou. O batch pode continuar pendente —',
                'confira `scripts/batch_pendente.txt` e rode o workflow manualmente.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
