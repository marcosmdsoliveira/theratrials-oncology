name: Trial Matcher — auditoria e relatório de diferenças

# Roda o br_ciclo.py: audita os NCTs publicados (ainda recrutam NO BRASIL?),
# descobre estudos novos, monta um banco proposto numa cópia, passa o QA e
# gera o relatório de diferenças.
#
# SÓ LEITURA. Não commita, não faz push, não abre PR, não remove estudo, não
# usa IA e não precisa de secret. O resultado sai como artifact e no resumo
# do run; aplicar o banco proposto é decisão humana. Ver scripts/br_PIPELINE.md.
#
# Único pipeline autorizado a olhar o trials_br.js: os workflows mensais
# antigos estão desativados em .github/workflows-legado/.
#
# Histórico sem commit: cada run baixa o artifact `trials-br-estado` da run
# anterior, audita com --gravar-estado e sobe o estado novo. Assim o relatório
# diz o que mudou desde a última semana. Se a corrente quebrar (artifact
# expira em 90 dias), a run seguinte recomeça como primeira rodada.

on:
  # Semanal basta: status de recrutamento muda em dias, não em horas, e a API
  # do CT.gov é gratuita mas pede moderação. Segunda de manhã para o relatório
  # estar pronto no começo da semana. Só passa a valer quando este arquivo
  # estiver no main. O GitHub suspende cron de repositório sem atividade há
  # 60 dias, e avisa por e-mail.
  schedule:
    - cron: '17 9 * * 1'   # segunda, 09:17 UTC (≈ 06:17 BRT); minuto quebrado evita o pico da hora cheia
  workflow_dispatch:
    inputs:
      centros:
        description: 'Propor também a reescrita dos centros (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read     # só para baixar o artifact de estado da run anterior

# Uma run por vez: duas runs simultâneas disputariam o artifact de estado.
concurrency:
  group: trials-br
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O override humano (br_aprovados.json) só pode trocar o propósito
      # declarado de um NCT listado. Se os testes que garantem isso falharem,
      # nada roda: sem histórico restaurado, sem ciclo, sem relatório, sem
      # artifact de estado — o da run anterior fica intacto para a próxima.
      - name: Testes do override humano (br_aprovados)
        id: testes
        run: |
          python3 scripts/test_br_aprovados.py || {
            echo "::error title=Testes do br_aprovados falharam::O ciclo não foi executado. Nenhum relatório foi gerado; o histórico anterior foi mantido."
            exit 1
          }

      - name: Restaurar o histórico da run anterior
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for ID in $(gh run list --workflow trials-br-auditoria.yml --limit 10 \
                        --json databaseId,status -q '.[] | select(.status=="completed") | .databaseId'); do
            if gh run download "$ID" -n trials-br-estado -D scripts/ 2>/dev/null; then
              echo "histórico restaurado da run $ID"; exit 0
            fi
          done
          echo "::notice title=Sem histórico::Nenhuma run anterior com estado — esta será a primeira rodada."

      # Códigos do br_ciclo.py: 0 = QA OK · 3 = QA bloqueou (há relatório) ·
      # outro = falha técnica (API fora, timeout, resposta parcial: não há
      # relatório confiável). O passo não derruba o job antes dos uploads; a
      # decisão fica nos dois últimos passos, que leem `rc`. Se o passo for
      # morto (timeout do job), `rc` fica vazio e conta como falha técnica.
      - name: Ciclo (auditoria, descoberta, proposto, QA, relatório)
        id: ciclo
        continue-on-error: true
        run: |
          ARGS=""
          [ "${{ github.event.inputs.centros }}" = "true" ] && ARGS="--centros"
          set +e
          python3 scripts/br_ciclo.py --gravar-estado $ARGS
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Publicar o relatório no resumo do run
        if: always()
        env:
          RC: ${{ steps.ciclo.outputs.rc }}
          TESTES: ${{ steps.testes.outcome }}
        run: |
          if [ "$TESTES" != "success" ]; then
            {
              echo "# ⛔ Testes do br_aprovados falharam — ciclo não executado"
              echo
              echo "Os testes que limitam o override humano a \`primary_purpose\` falharam."
              echo "**Nenhum relatório foi gerado** e o histórico da run anterior não foi"
              echo "tocado. O erro está no log do passo \"Testes do override humano\"."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" = "0" ] || [ "$RC" = "3" ]; then
            cat scripts/_br_relatorio.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# ⛔ Falha técnica — veja o log"
              echo
              echo "O ciclo parou antes de concluir (código \`${RC:-sem código}\`): API do"
              echo "ClinicalTrials.gov fora do ar, timeout ou resposta parcial. **Nenhum"
              echo "relatório foi gerado** e o histórico da run anterior foi mantido."
              echo "O erro está no log do passo \"Ciclo\"."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Só com o ciclo concluído (QA OK ou bloqueado). Em falha técnica, o
      # que houver em disco é parcial e não sobe, para não parecer resultado.
      - name: Guardar relatório e banco proposto
        if: always() && (steps.ciclo.outputs.rc == '0' || steps.ciclo.outputs.rc == '3')
        uses: actions/upload-artifact@v4
        with:
          name: trials-br-relatorio-${{ github.run_id }}
          retention-days: 90
          path: |
            scripts/_br_relatorio.md
            scripts/_br_relatorio.json
            scripts/_br_proposto/trials_br.js
            scripts/_br_discovery.json
          if-no-files-found: error

      # Em nome fixo para a run seguinte achar. Nunca vai para o git. Em falha
      # técnica o ciclo não grava estado, então sobe de novo o que foi
      # restaurado — a corrente não quebra.
      - name: Guardar o estado para a próxima run
        if: always() && steps.testes.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trials-br-estado
          retention-days: 90
          path: |
            scripts/br_estado.json
            scripts/br_eventos.jsonl
          if-no-files-found: ignore

      - name: Falhar se o QA bloqueou
        if: steps.ciclo.outputs.rc == '3'
        run: |
          echo "::error title=QA bloqueou o banco proposto::Veja a seção 7 do relatório."
          exit 1

      - name: Falhar em falha técnica
        if: always() && steps.testes.outcome == 'success' && steps.ciclo.outputs.rc != '0' && steps.ciclo.outputs.rc != '3'
        run: |
          echo "::error title=Falha técnica — veja o log::O ciclo não concluiu (código '${{ steps.ciclo.outputs.rc }}'). Nenhum relatório foi gerado; o histórico anterior foi mantido."
          exit 1
