name: Update TheraTrials Explorer (radioligand therapy)

# Atualiza assets/data/explorer.json com o dataset completo do
# ClinicalTrials.gov v2 todo dia 1 de cada mês.
# Também pode ser disparado manualmente (workflow_dispatch).

on:
  schedule:
    - cron: '17 5 1 * *'   # dia 1, 05:17 UTC (≈ 02:17 BRT)
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Commitar mesmo se não houver diff (útil para teste)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: update-explorer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pipeline fetcher
        id: fetch
        run: |
          python scripts/fetch_trials.py
          echo "json_bytes=$(stat -c %s assets/data/explorer.json)" >> "$GITHUB_OUTPUT"
          echo "trials=$(python -c 'import json;print(json.load(open(\"assets/data/explorer.json\"))[\"totals\"][\"trials\"])')" >> "$GITHUB_OUTPUT"

      - name: Diff summary
        run: |
          echo "## TheraTrials Explorer atualizado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Estudos** no JSON final: ${{ steps.fetch.outputs.trials }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tamanho** de \`assets/data/explorer.json\`: ${{ steps.fetch.outputs.json_bytes }} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat assets/data/explorer.json || true

      - name: Commit and push if changed
        env:
          FORCE: ${{ github.event.inputs.force_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/data/explorer.json assets/data/explorer.js && [ "$FORCE" != "true" ]; then
            echo "explorer.json/explorer.js sem mudanças — nada a fazer."
          else
            # O aplicativo confere o SHA-256 de cada dataset contra o
            # app-data/manifest.json antes de aceitar o download. Refrescar o
            # explorer sem regenerar o manifest faz o site ficar certo e o app
            # descartar o arquivo EM SILÊNCIO — foi o que ocorreu entre
            # 9d3fffe (01/set/2026) e a correção deste passo.
            #
            # A regeneração fica aqui dentro, e não num passo próprio, porque
            # o manifest carrega generatedAt: regenerar fora do if produziria
            # diff — e commit — todo mês, mesmo sem mudança no explorer.
            node scripts/export_app_data.mjs
            node scripts/validate_app_data.mjs
            git add assets/data/explorer.json assets/data/explorer.js app-data/
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data(pipeline): refresh CT.gov RLT pipeline ($DATE) · ${{ steps.fetch.outputs.trials }} estudos"
            git push
            echo "✓ explorer.json/explorer.js e app-data/ bumpados e empurrados"
          fi
