name: Monthly Newsletter

# Gera e envia a newsletter mensal do TheraTrials Oncology.
# Roda no dia 2 de cada mês (após o refresh do explorer no dia 1)
# para incluir os dados mais recentes do pipeline.
# Também pode ser disparado manualmente (workflow_dispatch).

on:
  schedule:
    - cron: '0 12 2 * *'   # dia 2, 12:00 UTC (≈ 09:00 BRT)
  workflow_dispatch:
    inputs:
      send_mode:
        description: 'Modo de envio: "draft" (default) ou "send" (envio direto)'
        required: false
        default: 'draft'
      edition:
        description: 'Edição específica (YYYY-MM). Deixe vazio para o mês atual.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write   # abre issue automática se o envio falhar

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ATENÇÃO na primeira execução após um período parado:
      # o delta ("novos este mês") é calculado contra newsletters/last_snapshot.json,
      # que só é atualizado quando o gerador roda. Com o snapshot parado em
      # 2026-05-24, a próxima edição vai somar TODO o período acumulado e rotular
      # como "deste mês" (ex.: tracker_total era 0 no snapshot → +53 "novos").
      # Revisar os números da primeira edição antes de enviar (use send_mode: draft).
      - name: Generate newsletter content
        id: generate
        run: |
          python scripts/generate_newsletter.py
          echo "generated=true" >> "$GITHUB_OUTPUT"

      # Arquiva ANTES de enviar: se o envio falhar, a edição gerada não se perde.
      # (Até 2026-08 o commit vinha depois do envio e era pulado a cada falha —
      #  o arquivo público ficou parado em 2026-05 sem ninguém perceber.)
      - name: Commit newsletter archive
        if: steps.generate.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet newsletters/ 2>/dev/null && [ -z "$(git ls-files --others newsletters/)" ]; then
            echo "Sem mudanças em newsletters/ — nada a commitar."
          else
            git add newsletters/
            DATE=$(date -u +"%Y-%m")
            git commit -m "newsletter: edição $DATE"
            git push
            echo "✓ Newsletter $DATE commitada e publicada"
          fi

      - name: Check Buttondown credentials
        id: creds
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=BUTTONDOWN_API_KEY ausente::O secret nao esta configurado no repositorio. A edicao foi gerada e arquivada, mas NAO foi enviada aos inscritos. Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Send via Buttondown
        if: steps.creds.outputs.present == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          SEND_FLAG=""
          if [ "${{ github.event.inputs.send_mode }}" = "send" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            SEND_FLAG="--send"
          fi
          EDITION_FLAG=""
          if [ -n "${{ github.event.inputs.edition }}" ]; then
            EDITION_FLAG="--edition ${{ github.event.inputs.edition }}"
          fi
          python scripts/send_newsletter.py $SEND_FLAG $EDITION_FLAG

      - name: Summary
        if: success()
        run: |
          echo "## Newsletter gerada e enviada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Edição:** $(date -u +%Y-%m)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Modo:** ${{ github.event.inputs.send_mode || 'send (scheduled)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Arquivos:** newsletters/$(date -u +%Y-%m).md, newsletters/$(date -u +%Y-%m).html" >> "$GITHUB_STEP_SUMMARY"

      # Sem isto a falha fica só no histórico do Actions — foi assim que
      # 3 meses de newsletter passaram despercebidos.
      - name: Abrir issue se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const edicao = new Date().toISOString().slice(0, 7);
            const titulo = `Newsletter ${edicao} falhou`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'newsletter-falha',
            });
            if (existentes.data.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['newsletter-falha'],
              body: [
                `O workflow **Monthly Newsletter** falhou na edição \`${edicao}\`.`,
                ``,
                `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- Disparo: \`${context.eventName}\``,
                ``,
                `A edição pode ter sido gerada e arquivada mesmo assim — confira \`newsletters/${edicao}.*\`.`,
                `Causa mais comum: secret \`BUTTONDOWN_API_KEY\` ausente ou expirado.`,
              ].join('\n'),
            });
