<style>
/* ── Back link ── */
.gd-back {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--stone);
  font-size: 0.85rem;
  margin-bottom: 1.5rem;
  transition: color 0.15s;
}
.gd-back:hover { color: var(--amber); }

/* ── Hero ── */
.gd-hero {
  padding: 3rem 0 2rem;
  position: relative;
  overflow: hidden;
}
.gd-hero::before {
  content: '';
  position: absolute;
  top: -40%; left: 50%; transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(255,132,0,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.gd-category-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 1rem;
}
.gd-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.3;
  color: var(--off-white);
  margin-bottom: 1.25rem;
  max-width: 900px;
}
.gd-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1rem;
}
.gd-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.82rem;
  color: var(--stone);
}
.gd-meta-item i { width: 14px; height: 14px; opacity: 0.7; }
.gd-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.gd-badge {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  white-space: nowrap;
}
.gd-badge-recent {
  background: rgba(52,211,153,0.12);
  color: #34D399;
  border: 1px solid rgba(52,211,153,0.25);
}
.gd-badge-essential {
  background: var(--amber-soft);
  color: var(--amber);
  border: 1px solid rgba(255,132,0,0.25);
}
.gd-badge-dosimetry {
  background: rgba(96,165,250,0.12);
  color: #60A5FA;
  border: 1px solid rgba(96,165,250,0.25);
}
.gd-badge-imaging {
  background: rgba(192,132,252,0.12);
  color: #C084FC;
  border: 1px solid rgba(192,132,252,0.25);
}
.gd-badge-service {
  background: rgba(14,165,183,0.12);
  color: var(--teal);
  border: 1px solid rgba(14,165,183,0.25);
}

/* ── Stats Overview Bar ── */
.gd-stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  padding: 1.5rem 0 0.5rem;
}
.gd-stat-card {
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 1rem 1.1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.gd-stat-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: rgba(255,132,0,0.1);
  color: var(--amber);
}
.gd-stat-icon i { width: 16px; height: 16px; }
.gd-stat-info { display: flex; flex-direction: column; gap: 0.15rem; }
.gd-stat-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--stone);
  font-weight: 500;
}
.gd-stat-value {
  font-family: var(--font-display);
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--off-white);
  line-height: 1.2;
}

/* ── Content layout ── */
.gd-layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 2.5rem;
  padding: 2rem 0 4rem;
}
@media (max-width: 860px) {
  .gd-layout { grid-template-columns: 1fr; }
  .gd-toc { display: none; }
}

/* ── TOC sidebar ── */
.gd-toc {
  position: sticky;
  top: 90px;
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  align-self: start;
}
.gd-toc h4 {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--stone);
  margin: 0 0 0.75rem;
  font-weight: 600;
}
.gd-toc a {
  display: block;
  color: var(--off-white);
  opacity: 0.7;
  font-size: 0.82rem;
  padding: 0.35rem 0.5rem;
  border-radius: var(--radius-sm);
  margin-bottom: 0.1rem;
  transition: all 0.2s ease;
  border-left: 2px solid transparent;
}
.gd-toc a:hover { opacity: 1; background: var(--graphite-3); border-left-color: var(--amber); }
.gd-toc a.active {
  opacity: 1;
  background: var(--graphite-3);
  border-left-color: var(--amber);
  color: var(--amber);
  font-weight: 600;
}

/* ── Content sections ── */
.gd-section {
  margin-bottom: 2.5rem;
  scroll-margin-top: 90px;
}
.gd-section-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  cursor: pointer;
  user-select: none;
  padding: 0.4rem 0;
  border-radius: var(--radius-sm);
  transition: opacity 0.15s;
}
.gd-section-header:hover { opacity: 0.85; }
.gd-section-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.gd-section-icon i { width: 16px; height: 16px; }
.gd-section h2 {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--off-white);
  letter-spacing: -0.01em;
  margin: 0;
  flex: 1;
}
.gd-section p, .gd-section li {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--stone);
}

/* ── Section toggle chevron ── */
.gd-section-toggle {
  width: 20px;
  height: 20px;
  color: var(--stone);
  transition: transform 0.3s ease;
  flex-shrink: 0;
}
.gd-section.collapsed .gd-section-toggle {
  transform: rotate(-90deg);
}

/* ── Section body collapse ── */
.gd-section-body {
  max-height: 5000px;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  opacity: 1;
}
.gd-section.collapsed .gd-section-body {
  max-height: 0;
  opacity: 0;
}

/* ── Scope blockquote style ── */
.gd-scope-block {
  border-left: 3px solid var(--amber);
  padding: 1rem 1.25rem;
  background: var(--graphite-2);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--stone);
}

/* ── Key Points: Numbered Cards Grid ── */
.gd-kp-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
}
@media (max-width: 700px) {
  .gd-kp-grid { grid-template-columns: 1fr; }
}
.gd-kp-card {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 1rem;
  transition: border-color 0.2s ease;
}
.gd-kp-card:hover { border-color: rgba(96,165,250,0.35); }
.gd-kp-num {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;
  background: var(--amber);
  color: var(--graphite);
  font-family: var(--font-display);
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.1rem;
}
.gd-kp-text {
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--off-white);
  opacity: 0.9;
}

/* ── Indications: Checklist ── */
.gd-check-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.gd-check-item {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.7rem 1rem;
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  transition: border-color 0.2s ease;
}
.gd-check-item:hover { border-color: rgba(52,211,153,0.35); }
.gd-check-icon {
  color: #34D399;
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.gd-check-icon i { width: 18px; height: 18px; }
.gd-check-text {
  font-size: 0.88rem;
  line-height: 1.55;
  color: var(--off-white);
  opacity: 0.9;
}

/* ── Timeline: Practical Aspects ── */
.gd-timeline {
  position: relative;
  padding-left: 2.5rem;
}
.gd-timeline::before {
  content: '';
  position: absolute;
  left: 13px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border-soft);
}
.gd-timeline-step {
  position: relative;
  margin-bottom: 1rem;
}
.gd-timeline-step:last-child { margin-bottom: 0; }
.gd-timeline-dot {
  position: absolute;
  left: -2.5rem;
  top: 0.9rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--graphite-2);
  border: 2px solid var(--amber);
  color: var(--amber);
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.gd-timeline-content {
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 0.9rem 1.1rem;
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--stone);
  transition: border-color 0.2s ease;
}
.gd-timeline-step:hover .gd-timeline-content {
  border-color: rgba(251,146,60,0.35);
}

/* ── Limitation Alert Cards ── */
.gd-limit-card {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.9rem 1.1rem;
  background: var(--graphite-2);
  border: 1px solid rgba(255,132,0,0.2);
  border-radius: var(--radius-md);
  margin-bottom: 0.6rem;
  transition: border-color 0.2s ease;
}
.gd-limit-card:hover { border-color: rgba(255,132,0,0.45); }
.gd-limit-card:last-child { margin-bottom: 0; }
.gd-limit-icon {
  color: var(--amber);
  flex-shrink: 0;
  margin-top: 0.15rem;
  opacity: 0.8;
}
.gd-limit-icon i { width: 16px; height: 16px; }
.gd-limit-text {
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--stone);
}

/* ── Show More / Show Less button ── */
.gd-show-more {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.75rem;
  padding: 0.45rem 1rem;
  background: var(--graphite-3);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  color: var(--amber);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.gd-show-more:hover {
  background: rgba(255,132,0,0.1);
  border-color: rgba(255,132,0,0.3);
}
.gd-show-more i { width: 14px; height: 14px; }

/* ── Pharma card enhanced ── */
.gd-pharma-card {
  background: var(--graphite-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  font-size: 0.9rem;
  color: var(--off-white);

<script>
(function() {
  var data = window.GUIDELINES_DATA || [];
  var id = location.hash.replace('#', '');
  if (!id && location.search) {
    var m = location.search.match(/[?&]id=([^&]+)/);
    if (m) id = decodeURIComponent(m[1]);
  }

  var g = null;
  var gIndex = -1;
  for (var i = 0; i < data.length; i++) {
    if (data[i].id === id) { g = data[i]; gIndex = i; break; }
  }

  var root = document.getElementById('gdContent');

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  if (!g) {
    root.innerHTML =
      '<div class="gd-error container">' +
        '<h2>Guideline não encontrado</h2>' +
        '<p>O identificador solicitado não corresponde a nenhum guideline disponível.</p>' +
        '<a href="guidelines.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Voltar para Guidelines</a>' +
      '</div>';
    document.title = 'Guideline não encontrado | TheraTrials Oncology';
    if (typeof lucide !== 'undefined') lucide.createIcons();
    return;
  }

  document.title = g.title + ' | TheraTrials Oncology';

  /* ── Badges ── */
  var badgeMap = {
    recent:    '<span class="gd-badge gd-badge-recent">Recente</span>',
    essential: '<span class="gd-badge gd-badge-essential">Essencial</span>',
    dosimetry: '<span class="gd-badge gd-badge-dosimetry">Dosimetria</span>',
    imaging:   '<span class="gd-badge gd-badge-imaging">Imagem</span>',
    service:   '<span class="gd-badge gd-badge-service">Serviço</span>'
  };
  var badgesHtml = '';
  if (g.badges && g.badges.length) {
    badgesHtml = '<div class="gd-badges">';
    for (var b = 0; b < g.badges.length; b++) {
      badgesHtml += (badgeMap[g.badges[b]] || '');
    }
    badgesHtml += '</div>';
  }

  /* ── Stats bar ── */
  var numInd = g.indications ? g.indications.length : 0;
  var numKp = g.keyPoints ? g.keyPoints.length : 0;
  var statsHtml =
    '<div class="gd-stats-bar">' +
      (g.year ?
      '<div class="gd-stat-card">' +
        '<div class="gd-stat-icon" style="background:rgba(255,132,0,0.1);color:var(--amber)"><i data-lucide="calendar"></i></div>' +
        '<div class="gd-stat-info"><span class="gd-stat-label">Ano</span><span class="gd-stat-value">' + esc(g.year) + '</span></div>' +
      '</div>' : '') +
      '<div class="gd-stat-card">' +
        '<div class="gd-stat-icon" style="background:rgba(14,165,183,0.1);color:var(--teal)"><i data-lucide="users"></i></div>' +
        '<div class="gd-stat-info"><span class="gd-stat-label">Sociedade</span><span class="gd-stat-value">' + esc(g.society) + '</span></div>' +
      '</div>' +
      '<div class="gd-stat-card">' +
        '<div class="gd-stat-icon" style="background:rgba(96,165,250,0.1);color:#60A5FA"><i data-lucide="file-text"></i></div>' +
        '<div class="gd-stat-info"><span class="gd-stat-label">Tipo</span><span class="gd-stat-value">' + esc(g.type) + '</span></div>' +
      '</div>' +
      '<div class="gd-stat-card">' +
        '<div class="gd-stat-icon" style="background:rgba(52,211,153,0.1);color:#34D399"><i data-lucide="clipboard-list"></i></div>' +
        '<div class="gd-stat-info"><span class="gd-stat-label">Indicações</span><span class="gd-stat-value">' + numInd + '</span></div>' +
      '</div>' +
      '<div class="gd-stat-card">' +
        '<div class="gd-stat-icon" style="background:rgba(192,132,252,0.1);color:#C084FC"><i data-lucide="list-checks"></i></div>' +
        '<div class="gd-stat-info"><span class="gd-stat-label">Pontos-chave</span><span class="gd-stat-value">' + numKp + '</span></div>' +
      '</div>' +
    '</div>';

  /* ── Indications: checklist with show-more ── */
  var indicationsLimit = 6;
  var indicationsHtml = '';
  if (g.indications && g.indications.length) {
    indicationsHtml = '<div class="gd-check-list">';
    for (var j = 0; j < g.indications.length; j++) {
      var hiddenInd = j >= indicationsLimit ? ' style="display:none" data-hidden-ind' : '';
      indicationsHtml +=
        '<div class="gd-check-item"' + hiddenInd + '>' +
          '<span class="gd-check-icon"><i data-lucide="check-circle"></i></span>' +
          '<span class="gd-check-text">' + esc(g.indications[j]) + '</span>' +
        '</div>';
    }
    indicationsHtml += '</div>';
    if (g.indications.length > indicationsLimit) {
      indicationsHtml +=
        '<button class="gd-show-more" data-target="ind" data-total="' + g.indications.length + '">' +
          '<i data-lucide="chevron-down"></i> Mostrar todas (' + g.indications.length + ')' +
        '</button>';
    }
  }

  /* ── Key Points: numbered cards grid with show-more ── */
  var kpLimit = 8;
  var keyPointsHtml = '';
  if (g.keyPoints && g.keyPoints.length) {
    keyPointsHtml = '<div class="gd-kp-grid">';
    for (var k = 0; k < g.keyPoints.length; k++) {
      var hiddenKp = k >= kpLimit ? ' style="display:none" data-hidden-kp' : '';
      keyPointsHtml +=
        '<div class="gd-kp-card"' + hiddenKp + '>' +
          '<span class="gd-kp-num">' + (k + 1) + '</span>' +
          '<span class="gd-kp-text">' + esc(g.keyPoints[k]) + '</span>' +
        '</div>';
    }
    keyPointsHtml += '</div>';
    if (g.keyPoints.length > kpLimit) {
      keyPointsHtml +=
        '<button class="gd-show-more" data-target="kp" data-total="' + g.keyPoints.length + '">' +
          '<i data-lucide="chevron-down"></i> Mostrar todos (' + g.keyPoints.length + ')' +
        '</button>';
    }
  }

  /* ── Practical Aspects: timeline steps ── */
  var practicalHtml = '';
  if (g.practicalAspects) {
    var steps = g.practicalAspects.split('. ').filter(function(s) { return s.trim().length > 0; });
    practicalHtml = '<div class="gd-timeline">';
    for (var p = 0; p < steps.length; p++) {
      var stepText = steps[p].replace(/\.$/, '').trim();
      if (!stepText) continue;
      practicalHtml +=
        '<div class="gd-timeline-step">' +
          '<div class="gd-timeline-dot">' + (p + 1) + '</div>' +
          '<div class="gd-timeline-content">' + esc(stepText) + '.</div>' +
        '</div>';
    }
    practicalHtml += '</div>';
  }

  /* ── Limitations: alert cards ── */
  var limitationsHtml = '';
  if (g.limitations) {
    var limItems = g.limitations.split('. ').filter(function(s) { return s.trim().length > 0; });
    limitationsHtml = '<div class="gd-limits-list">';
    for (var l = 0; l < limItems.length; l++) {
      var limText = limItems[l].replace(/\.$/, '').trim();
      if (!limText) continue;
      limitationsHtml +=
        '<div class="gd-limit-card">' +
          '<span class="gd-limit-icon"><i data-lucide="alert-triangle"></i></span>' +
          '<span class="gd-limit-text">' + esc(limText) + '.</span>' +
        '</div>';
    }
    limitationsHtml += '</div>';
  }

  /* ── Radiopharmaceuticals: enhanced card ── */
  var pharmaHtml =
    '<div class="gd-pharma-card">' +
      '<div class="gd-pharma-header"><i data-lucide="atom"></i><span>Radiofármacos Envolvidos</span></div>' +
      '<div>' + esc(g.radiopharmaceuticals) + '</div>' +
    '</div>';

  /* ── TOC ── */
  var tocItems = [
    { id: 'escopo',      label: 'Escopo' },
    { id: 'indicacoes',  label: 'Indicações' },
    { id: 'pontos',      label: 'Pontos-chave' },
    { id: 'farmacos',    label: 'Radiofármacos' },
    { id: 'praticos',    label: 'Aspectos Práticos' },
    { id: 'limitacoes',  label: 'Limitações' },
    { id: 'referencia',  label: 'Referência' }
  ];
  /* Add cross-link TOC entry if this guideline has related radiofarmacos */
  var _cl = window.CROSS_LINKS;
  if (_cl && _cl.GL_TO_RF && _cl.GL_TO_RF[g.id] && _cl.GL_TO_RF[g.id].length) {
    tocItems.push({ id: 'radiofarmacos-rel', label: 'Dossiês' });
  }
  var tocHtml = '';
  for (var t = 0; t < tocItems.length; t++) {
    tocHtml += '<a href="#' + tocItems[t].id + '" data-toc-link="' + tocItems[t].id + '">' + tocItems[t].label + '</a>';
  }

  /* ── Prev / Next navigation ── */
  var prevLink = '', nextLink = '';
  if (gIndex > 0) {
    var prev = data[gIndex - 1];
    prevLink = '<a class="gd-nav-link" href="guideline-detail.html#' + prev.id + '">' +
      '<span class="gd-nav-label">← Anterior</span>' +
      '<span class="gd-nav-title">' + esc(prev.title) + '</span></a>';
  }
  if (gIndex < data.length - 1) {
    var next = data[gIndex + 1];
    nextLink = '<a class="gd-nav-link next" href="guideline-detail.html#' + next.id + '">' +
      '<span class="gd-nav-label">Próximo →</span>' +
      '<span class="gd-nav-title">' + esc(next.title) + '</span></a>';
  }

  var catColor = g.categoryColor || '#FF8400';

  /* ── Section builder helper ── */
  function section(sId, iconBg, iconColor, iconName, title, body) {
    return '<div class="gd-section" id="' + sId + '">' +
      '<div class="gd-section-header" data-section-toggle="' + sId + '">' +
        '<div class="gd-section-icon" style="background:' + iconBg + ';color:' + iconColor + '"><i data-lucide="' + iconName + '"></i></div>' +
        '<h2>' + title + '</h2>' +
        '<i data-lucide="chevron-down" class="gd-section-toggle"></i>' +
      '</div>' +
      '<div class="gd-section-body">' + body + '</div>' +
    '</div>';
  }

  /* ── Rich modular page builder (usado quando g.rich existe; fallback p/ as demais) ── */
  function renderRichPage() {
    var R = g.rich;
    function paras(arr) { return (arr || []).map(function(p){ return '<p class="gd-rp">' + esc(p) + '</p>'; }).join(''); }
    function rbClass(b) {
      if (/^\d{4}$/.test(b)) return 'year';
      if (/^(EANM|IAEA|SNMMI|ESMO|ATA|ACR|ACNM|ARS|NANETS)$/.test(b)) return 'soc';
      if (/Guideline|Procedure|Practice|SOP|Standard|guidance|Recommendations|Parameter/i.test(b)) return 'type';
      if (/PRRT|SSTR|PSMA|RLT|Theranostics|Teran|177Lu|90Y|131I|223Ra|225Ac|68Ga|TARE|Dosimetr|Radioiod|MIBG|Bone|RSO/i.test(b)) return 'th';
      return 'cat';
    }
    var rb = (R.badges||[]).map(function(b){ return '<span class="gd-rbadge gd-rbadge-' + rbClass(b) + '">' + esc(b) + '</span>'; }).join('');
    var cc = '';
    if (R.conceptCards && R.conceptCards.length) {
      cc = '<div class="gd-concept-row">' + R.conceptCards.map(function(c){
        return '<div class="gd-concept-card"><div class="gd-concept-icon"><i data-lucide="' + esc(c.icon) + '"></i></div>' +
          '<div class="gd-concept-title">' + esc(c.title) + '</div><div class="gd-concept-text">' + esc(c.text) + '</div></div>';
      }).join('') + '</div>';
    }
    function calloutBox(cls, icon, title, text) {
      return '<div class="gd-callout ' + cls + '"><div class="gd-callout-head"><i data-lucide="' + icon + '"></i> ' + esc(title) + '</div>' +
        '<div class="gd-callout-text">' + esc(text) + '</div></div>';
    }
    var cautionHtml = R.cautionBox ? calloutBox('gd-callout-warn','alert-octagon', R.cautionBox.title, R.cautionBox.text) : '';
    var dontHtml = R.dontConfuse ? calloutBox('gd-callout-info','split', R.dontConfuse.title, R.dontConfuse.text) : '';
    function secBody(sec) {
      if (sec.type === 'text') return paras(sec.paragraphs);
      if (sec.type === 'grouped') return (sec.groups||[]).map(function(grp){
        return '<div class="gd-rgroup' + (grp.box ? ' gd-rgroup-box' : '') + '"><div class="gd-rgroup-title">' + esc(grp.title) + '</div>' + paras(grp.paragraphs) + '</div>';
      }).join('');
      if (sec.type === 'bullets') return '<ul class="gd-rbullets">' + (sec.items||[]).map(function(it){ return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>';
      if (sec.type === 'cards') return '<div class="gd-rcards">' + (sec.cards||[]).map(function(cd){
        return '<div class="gd-rcard"><div class="gd-rcard-head"><span class="gd-rcard-title">' + esc(cd.title) + '</span>' +
          (cd.tag ? '<span class="gd-rcard-tag">' + esc(cd.tag) + '</span>' : '') + '</div>' + paras(cd.paragraphs) + '</div>';
      }).join('') + '</div>';
      if (sec.type === 'timeline') return '<div class="gd-rtimeline">' + (sec.phases||[]).map(function(ph, i){
        return '<div class="gd-rphase"><div class="gd-rphase-dot">' + (i+1) + '</div><div class="gd-rphase-body"><div class="gd-rphase-title">' + esc(ph.title) + '</div>' + paras(ph.paragraphs) + '</div></div>';
      }).join('') + '</div>';
      return '';
    }
    function richSection(sec) {
      return '<div class="gd-section gd-rsection collapsed" id="' + sec.id + '">' +
        '<div class="gd-section-header gd-rheader" data-section-toggle="' + sec.id + '">' +
          '<div class="gd-section-icon" style="background:' + sec.color + '1a;color:' + sec.color + '"><i data-lucide="' + sec.icon + '"></i></div>' +
          '<div class="gd-rhead-text"><h2>' + esc(sec.title) + '</h2>' +
            (sec.summary ? '<div class="gd-rsummary">' + esc(sec.summary) + '</div>' : '') + '</div>' +
          '<i data-lucide="chevron-down" class="gd-section-toggle"></i>' +
        '</div>' +
        '<div class="gd-section-body">' + secBody(sec) + '</div>' +
      '</div>';
    }
    var conceptStrip = cc ? '<div class="gd-concept-strip"><div class="gd-strip-h"><i data-lucide="sparkles"></i> Conceitos-chave</div>' + cc + '</div>' : '';
    var expandBar = '<div class="gd-expand-bar"><span class="gd-expand-hint">Clique em uma seção para abrir o conteúdo completo</span>' +
      '<button class="gd-expand-all" data-expand-all="0"><i data-lucide="chevrons-up-down"></i> <span>Expandir tudo</span></button></div>';
    var secHtml = expandBar;
    R.sections.forEach(function(sec){
      secHtml += richSection(sec);
      if (sec.id === 'indicacoes' && dontHtml) secHtml += '<div class="gd-section-extra">' + dontHtml + '</div>';
      if (sec.id === 'pontos' && cautionHtml) secHtml += '<div class="gd-section-extra">' + cautionHtml + '</div>';
    });
    var pm = R.practicalMessage, pmHtml = '';
    if (pm) {
      pmHtml = '<div class="gd-section" id="mensagem"><div class="gd-prmsg"><div class="gd-prmsg-head"><i data-lucide="flag"></i> Mensagem prática</div>' +
        '<p class="gd-prmsg-intro">' + esc(pm.intro) + '</p><p class="gd-prmsg-lead">' + esc(pm.leadIn) + '</p>' +
        '<ol class="gd-prmsg-q">' + (pm.questions||[]).map(function(q){ return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>' +
        '<p class="gd-prmsg-close">' + esc(pm.closing) + '</p></div></div>';
    }
    var toc = R.sections.map(function(sec){ return { id: sec.id, label: sec.title }; });
    if (pm) toc.push({ id:'mensagem', label:'Mensagem prática' });
    var tocH = toc.map(function(t){ return '<a href="#' + t.id + '" data-toc-link="' + t.id + '">' + esc(t.label) + '</a>'; }).join('');
    var refHtml = section('referencia', 'rgba(14,165,183,0.1)', 'var(--teal)', 'book-open', 'Referência', '<div class="gd-ref-box">' + esc(g.reference) + '</div>');
    var clHtml = (function() {
      var CL = window.CROSS_LINKS;
      if (!CL || !CL.GL_TO_RF || !CL.GL_TO_RF[g.id] || !CL.GL_TO_RF[g.id].length) return '';
      var pages = CL.GL_TO_RF[g.id], ch = '<div class="cl-grid">';
      pages.forEach(function(page){ var rf=CL.RF[page]; if(!rf) return;
        ch += '<a href="' + page + '" class="cl-card"><div style="position:absolute;top:0;left:0;width:3px;height:100%;background:' + rf.color + ';border-radius:3px 0 0 3px"></div>' +
          '<div class="cl-iso" style="background:' + rf.color + '18;color:' + rf.color + '"><span class="m">' + rf.mass + '</span><span class="e">' + rf.elem + '</span></div>' +
          '<div class="cl-info"><div class="cl-name">' + rf.name + '</div><div class="cl-desc">' + rf.desc + '</div></div></a>';
      });
      ch += '</div>';
      return section('radiofarmacos-rel','rgba(255,132,0,0.1)','var(--amber)','atom','Dossiês de Radiofármacos', ch);
    })();
    return '<section class="gd-hero"><div class="container">' +
        '<a href="guidelines.html" class="gd-back"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Voltar para Guidelines</a>' +
        '<div class="gd-category-tag" style="background:' + catColor + '18;color:' + catColor + ';border:1px solid ' + catColor + '40"><i data-lucide="bookmark" style="width:12px;height:12px"></i> ' + esc(g.categoryName) + '</div>' +
        '<h1 class="gd-title">' + esc(g.title) + '</h1>' +
        '<div class="gd-meta">' + (g.year ? '<span class="gd-meta-item"><i data-lucide="calendar" style="width:14px;height:14px"></i> ' + esc(g.year) + '</span>' : '') +
          '<span class="gd-meta-item"><i data-lucide="users" style="width:14px;height:14px"></i> ' + esc(g.society) + '</span>' +
          '<span class="gd-meta-item"><i data-lucide="file-text" style="width:14px;height:14px"></i> ' + esc(g.type) + '</span></div>' +
        '<div class="gd-rbadges">' + rb + '</div>' +
        '<p class="gd-hero-summary">' + esc(R.summary) + '</p>' +
      '</div></section>' +
      '<section><div class="container">' +
        '<div class="gd-why"><div class="gd-why-head"><i data-lucide="compass"></i> Por que esta diretriz importa?</div><p>' + esc(R.whyItMatters) + '</p></div>' +
        '<div class="gd-onesentence"><i data-lucide="quote"></i><span>' + esc(R.oneSentence) + '</span></div>' +
        conceptStrip +
      '</div></section>' +
      '<section><div class="container"><div class="gd-layout">' +
        '<aside class="gd-toc"><h4>Conteúdo</h4>' + tocH + '</aside>' +
        '<div class="gd-body">' + secHtml + pmHtml + refHtml + clHtml +
          '<div class="gd-nav-bottom">' + prevLink + nextLink + '</div>' +
        '</div>' +
      '</div></div></section>';
  }

  /* ── Assemble page ── */
  if (g.rich) {
    root.innerHTML = renderRichPage();
  } else {
  root.innerHTML =
    /* Hero */
    '<section class="gd-hero"><div class="container">' +
      '<a href="guidelines.html" class="gd-back"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Voltar para Guidelines</a>' +
      '<div class="gd-category-tag" style="background:' + catColor + '18;color:' + catColor + ';border:1px solid ' + catColor + '40">' +
        '<i data-lucide="bookmark" style="width:12px;height:12px"></i> ' + esc(g.categoryName) +
      '</div>' +
      '<h1 class="gd-title">' + esc(g.title) + '</h1>' +
      '<div class="gd-meta">' +
        (g.year ? '<span class="gd-meta-item"><i data-lucide="calendar" style="width:14px;height:14px"></i> ' + esc(g.year) + '</span>' : '') +
        '<span class="gd-meta-item"><i data-lucide="users" style="width:14px;height:14px"></i> ' + esc(g.society) + '</span>' +
        '<span class="gd-meta-item"><i data-lucide="file-text" style="width:14px;height:14px"></i> ' + esc(g.type) + '</span>' +
      '</div>' +
      badgesHtml +
    '</div></section>' +

    /* Stats bar */
    '<section><div class="container">' + statsHtml + '</div></section>' +

    /* Main content layout */
    '<section><div class="container"><div class="gd-layout">' +
      '<aside class="gd-toc"><h4>Conteúdo</h4>' + tocHtml + '</aside>' +
      '<div class="gd-body">' +
        section('escopo', 'rgba(255,132,0,0.1)', 'var(--amber)', 'target', 'Escopo',
          '<div class="gd-scope-block">' + esc(g.scope) + '</div>') +
        section('indicacoes', 'rgba(52,211,153,0.1)', '#34D399', 'clipboard-check', 'Indicações',
          indicationsHtml) +
        section('pontos', 'rgba(96,165,250,0.1)', '#60A5FA', 'lightbulb', 'Pontos-chave',
          keyPointsHtml) +
        section('farmacos', 'rgba(192,132,252,0.1)', '#C084FC', 'atom', 'Radiofármacos',
          pharmaHtml) +
        section('praticos', 'rgba(251,146,60,0.1)', '#FB923C', 'stethoscope', 'Aspectos Práticos',
          practicalHtml) +
        section('limitacoes', 'rgba(244,114,182,0.1)', '#F472B6', 'alert-triangle', 'Limitações',
          limitationsHtml) +
        section('referencia', 'rgba(14,165,183,0.1)', 'var(--teal)', 'book-open', 'Referência',
          '<div class="gd-ref-box">' + esc(g.reference) + '</div>') +
        /* Cross-link to radiofarmaco dossier pages */
        (function() {
          var CL = window.CROSS_LINKS;
          if (!CL || !CL.GL_TO_RF || !CL.GL_TO_RF[g.id]) return '';
          var pages = CL.GL_TO_RF[g.id];
          if (!pages.length) return '';
          var cardsHtml = '<div class="cl-grid">';
          pages.forEach(function(page) {
            var rf = CL.RF[page];
            if (!rf) return;
            cardsHtml += '<a href="' + page + '" class="cl-card">' +
              '<div style="position:absolute;top:0;left:0;width:3px;height:100%;background:' + rf.color + ';border-radius:3px 0 0 3px"></div>' +
              '<div class="cl-iso" style="background:' + rf.color + '18;color:' + rf.color + '">' +
                '<span class="m">' + rf.mass + '</span><span class="e">' + rf.elem + '</span>' +
              '</div>' +
              '<div class="cl-info">' +
                '<div class="cl-name">' + rf.name + '</div>' +
                '<div class="cl-desc">' + rf.desc + '</div>' +
              '</div>' +
              '<svg class="cl-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
            '</a>';
          });
          cardsHtml += '</div>';
          return section('radiofarmacos-rel', 'rgba(255,132,0,0.1)', 'var(--amber)', 'atom', 'Dossiês de Radiofármacos', cardsHtml);
        })() +
        '<div class="gd-nav-bottom">' + prevLink + nextLink + '</div>' +
      '</div>' +
    '</div></div></section>';
  }

  if (typeof lucide !== 'undefined') lucide.createIcons();

  /* ═══════════ INTERACTIVE BEHAVIORS ═══════════ */

  /* ── Collapsible sections toggle ── */
  var headers = document.querySelectorAll('[data-section-toggle]');
  for (var h = 0; h < headers.length; h++) {
    headers[h].addEventListener('click', function() {
      var sec = this.closest('.gd-section');
      if (sec) sec.classList.toggle('collapsed');
    });
  }

  /* ── Expand / collapse all (rich page) ── */
  var expandAllBtn = document.querySelector('[data-expand-all]');
  if (expandAllBtn) {
    expandAllBtn.addEventListener('click', function() {
      var secs = document.querySelectorAll('.gd-rsection');
      var expand = this.getAttribute('data-expand-all') === '0';
      for (var i = 0; i < secs.length; i++) {
        if (expand) secs[i].classList.remove('collapsed');
        else secs[i].classList.add('collapsed');
      }
      this.setAttribute('data-expand-all', expand ? '1' : '0');
      var lbl = this.querySelector('span');
      if (lbl) lbl.textContent = expand ? 'Recolher tudo' : 'Expandir tudo';
    });
  }

  /* ── Show More / Show Less: Indications ── */
  var showMoreBtns = document.querySelectorAll('.gd-show-more');
  for (var s = 0; s < showMoreBtns.length; s++) {
    showMoreBtns[s].addEventListener('click', function() {
      var target = this.getAttribute('data-target');
      var total = this.getAttribute('data-total');
      var attr = target === 'ind' ? 'data-hidden-ind' : 'data-hidden-kp';
      var items = document.querySelectorAll('[' + attr + ']');
      var isExpanded = this.getAttribute('data-expanded') === 'true';

      if (isExpanded) {
        for (var x = 0; x < items.length; x++) items[x].style.display = 'none';
        this.setAttribute('data-expanded', 'false');
        this.innerHTML = '<i data-lucide="chevron-down"></i> Mostrar ' + (target === 'ind' ? 'todas' : 'todos') + ' (' + total + ')';
      } else {
        for (var x = 0; x < items.length; x++) items[x].style.display = '';
        this.setAttribute('data-expanded', 'true');
        this.innerHTML = '<i data-lucide="chevron-up"></i> Mostrar menos';
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  }

  /* ── Smooth scroll for TOC links ── */
  var tocLinks = document.querySelectorAll('[data-toc-link]');
  for (var tl = 0; tl < tocLinks.length; tl++) {
    tocLinks[tl].addEventListener('click', function(e) {
      e.preventDefault();
      var targetId = this.getAttribute('data-toc-link');
      var targetEl = document.getElementById(targetId);
      if (targetEl) {
        /* un-collapse if collapsed */
        if (targetEl.classList.contains('collapsed')) {
          targetEl.classList.remove('collapsed');
        }
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }

  /* ── ScrollSpy for TOC using IntersectionObserver ── */
  if ('IntersectionObserver' in window) {
    var sections = document.querySelectorAll('.gd-section[id]');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        var link = document.querySelector('[data-toc-link="' + entry.target.id + '"]');
        if (link) {
          if (entry.isIntersecting) {
            /* Remove active from all */
            var allLinks = document.querySelectorAll('[data-toc-link]');
            for (var a = 0; a < allLinks.length; a++) allLinks[a].classList.remove('active');
            link.classList.add('active');
          }
        }
      });
    }, {
      rootMargin: '-80px 0px -60% 0px',
      threshold: 0
    });
    for (var o = 0; o < sections.length; o++) {
      observer.observe(sections[o]);
    }
  }

  /* ── Hash change reload ── */
  window.addEventListener('hashchange', function() { location.reload(); });

})();
</script>
</body>
</html>
