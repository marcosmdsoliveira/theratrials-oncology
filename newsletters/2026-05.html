<script>
// Simple markdown-to-HTML for archive display
(function() {
  var md = "# TheraTrials Newsletter — Maio 2026\n\n*Edição Maio 2026 · gerada automaticamente em 24/05/2026*\n\n---\n\n## Resumo do mês\n\n| Métrica | Atual | Novos este mês |\n|---------|-------|---------------|\n| Explorer (pipeline RLT global) | **1731** estudos | +1731 |\n| Ensaios ativos no Brasil | **60** estudos | +60 |\n| Tracker (radiofármacos) | **0** itens | +0 |\n\n## Novos ensaios no Explorer\n\nForam adicionados **1731 novos estudos** ao pipeline global de radioligantes terapêuticos.\n\n**Isótopos mais representados no pipeline:**\n\n- : 503 estudos\n- 177Lu: 380 estudos\n- 90Y: 340 estudos\n- 131I: 262 estudos\n- 223Ra: 115 estudos\n\n## Ensaios com recrutamento no Brasil\n\n**60 novos ensaios** com recrutamento aberto foram identificados em centros brasileiros.\n\nTotal atual: 60 estudos em recrutamento ativo.\n\n---\n\n## Acesse a plataforma\n\n- [Database](https://marcosmdsoliveira.github.io/theratrials-oncology/database.html) — 421 estudos analisados\n- [Explorer](https://marcosmdsoliveira.github.io/theratrials-oncology/explorer.html) — Pipeline RLT global\n- [Ensaios BR](https://marcosmdsoliveira.github.io/theratrials-oncology/ensaios-clinicos.html) — Recrutamento aberto no Brasil\n- [Guidelines](https://marcosmdsoliveira.github.io/theratrials-oncology/guidelines.html) — 26 guidelines internacionais\n\n---\n\n*TheraTrials Oncology · Plataforma de evidências clínicas em oncologia*\n*Curadoria: Dr. Marcos Oliveira — Médico nuclear*\n";
  var html = md
    .replace(/^# (.+)$/gm, '')  // skip h1, already in header
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>')
    .replace(/^\|(.+)$/gm, function(line) {
      if (line.match(/^\|[-\s|]+\|$/)) return '';
      var cells = line.split('|').filter(function(c){ return c.trim(); });
      var tag = line.indexOf('**') > -1 ? 'td' : 'td';
      return '<tr>' + cells.map(function(c){ return '<td>' + c.trim() + '</td>'; }).join('') + '</tr>';
    })
    .replace(/---/g, '<hr>')
    .replace(/\n\n/g, '<br><br>');
  document.getElementById('nl-content').innerHTML = html;
})();
</script>
